<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="utf-8" />
    <title>Trackr.jobs — international tech jobs</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Aggregated software-engineering jobs with visa sponsorship and relocation support from TokyoDev, Japan Dev, Relocate.me, and more."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#efece5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f1e1a" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Lato:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <!-- Apply the saved theme before Angular boots to avoid a light flash. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
  </head>
  <body class="min-h-full flex flex-col bg-[var(--background)] text-[var(--foreground)] font-sans">
    <app-root></app-root>
  </body>
</html>
