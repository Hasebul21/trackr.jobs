<section
  aria-label="Notifications"
  aria-live="polite"
  class="pointer-events-none fixed right-4 bottom-4 z-[60] flex w-[calc(100%-2rem)] max-w-sm flex-col gap-2"
>
  @for (t of toast.toasts(); track t.id) {
    <div
      role="status"
      class="pointer-events-auto relative flex items-start gap-2.5 rounded-lg border p-4 pr-9 text-sm shadow-[var(--shadow-2)]"
      [class]="
        t.type === 'success'
          ? 'border-[var(--gain-200)] bg-[var(--gain-50)] text-[var(--gain-700)]'
          : 'border-[var(--loss-200)] bg-[var(--loss-50)] text-[var(--loss-700)]'
      "
    >
      <app-icon
        [name]="t.type === 'success' ? 'check-circle' : 'x-circle'"
        iconClass="mt-0.5 h-4 w-4 shrink-0"
      />
      <div class="min-w-0">
        <div class="font-semibold">{{ t.title }}</div>
        @if (t.description) {
          <div class="mt-0.5 text-xs break-words opacity-90">{{ t.description }}</div>
        }
      </div>
      <button
        type="button"
        aria-label="Close toast"
        class="absolute top-2 right-2 rounded p-1 opacity-70 hover:opacity-100"
        (click)="toast.dismiss(t.id)"
      >
        <app-icon name="x" iconClass="h-3.5 w-3.5" />
      </button>
    </div>
  }
</section>
