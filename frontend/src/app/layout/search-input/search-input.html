<nz-input-wrapper class="w-full max-w-md">
  <nz-icon
    aria-hidden="true"
    nzInputPrefix
    nzType="search"
    class="text-[var(--muted-foreground)]"
  />
  <input
    nz-input
    #box
    type="text"
    [value]="value()"
    (input)="onInput(box.value)"
    placeholder="Search title, company, description…"
    aria-label="Search jobs"
  />
</nz-input-wrapper>
