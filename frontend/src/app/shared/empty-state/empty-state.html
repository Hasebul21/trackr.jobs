<div
  class="flex flex-col items-center justify-center gap-3 rounded-lg border border-dashed border-[var(--border)] p-12 text-center"
>
  <!-- Image only; the text below keeps the app's own typography. -->
  <nz-empty nzNotFoundImage="simple" [nzNotFoundContent]="null" class="m-0" />
  <div>
    <div class="font-medium">{{ heading() }}</div>
    <div class="max-w-sm text-sm text-[var(--muted-foreground)]">
      <ng-content>{{ hint() }}</ng-content>
    </div>
  </div>
</div>
