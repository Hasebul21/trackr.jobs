<nz-result nzStatus="error" nzTitle="Something went wrong" class="mx-auto max-w-md py-20">
  <div nz-result-subtitle class="font-mono text-sm break-all text-[var(--muted-foreground)]">
    {{ message() }}
  </div>
  <div nz-result-extra>
    <button nz-button nzType="primary" type="button" [class]="buttonClass" (click)="retry.emit()">
      Try again
    </button>
  </div>
</nz-result>
