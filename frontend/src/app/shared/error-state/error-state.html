<div class="mx-auto max-w-md space-y-4 py-20 text-center">
  <h1 class="text-xl font-semibold">Something went wrong</h1>
  <p class="font-mono text-sm break-all text-[var(--muted-foreground)]">{{ message() }}</p>
  <button type="button" [class]="buttonClass" (click)="retry.emit()">Try again</button>
</div>
